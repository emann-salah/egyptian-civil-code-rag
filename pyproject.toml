[project]
name = "civilcode-rag"
version = "0.1.0"
description = "RAG system for the Egyptian Civil Code"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "pdfplumber>=0.11.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "groq>=0.11.0",
]

[project.optional-dependencies]
experiments = ["mlflow>=2.12.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]