name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --default-timeout=120 torch --index-url https://download.pytorch.org/whl/cpu
          pip install --default-timeout=120 -e . pytest ruff dvc

      - name: Lint
        run: ruff check src tests

      - name: Rebuild corpus, validate, and index
        run: dvc repro

      - name: Eval gate
        run: python -m civilcode_rag.eval_gate

      - name: Build Docker image
        run: docker build -t civilcode-rag:${{ github.sha }} .