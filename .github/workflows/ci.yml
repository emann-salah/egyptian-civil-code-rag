name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --default-timeout=120 torch --index-url https://download.pytorch.org/whl/cpu
          pip install --default-timeout=120 -e . pytest ruff

      - name: Lint
        run: ruff check src tests

      - name: Run corpus validation tests
        run: pytest tests/test_corpus.py -v